# Las mismas compuertas que corre el agente y que corre CI.
# Nadie commitea con una compuerta en rojo. `--no-verify` esta prohibido.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff-format          # G0
      - id: ruff                 # G0
        args: ["--fix"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks             # ningun secreto entra al repo

  - repo: local
    hooks:
      - id: mypy                 # G1
        name: G1 tipos
        entry: uv run mypy src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: test-unit            # G2
        name: G2 unitarios
        entry: uv run pytest -m "not integration and not e2e" -q
        language: system
        pass_filenames: false
        types: [python]

      - id: migrations-check     # G4
        name: G4 migraciones
        entry: uv run python manage.py makemigrations --check --dry-run
        language: system
        pass_filenames: false
        types: [python]

      - id: no-decimal-money
        name: dinero entero (sin float ni Decimal)
        entry: 'Decimal\(|float\(.*(monto|precio|total|vuelto|gs)'
        language: pygrep
        files: ^src/.*\.py$
        exclude: ^src/.*/migrations/
